# Verify that Go protobuf bindings can be generated from the rc-x509-proto
# schema and that the resulting ffi-hosts/go/rcproto package compiles cleanly
# with the rest of the Go host. The generated bindings are not committed
# (see buf.gen.yaml), so this replaces a generate-then-diff check with a
# generate-then-build one.

name: buf-generate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-generated-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ffi-hosts/go/go.mod

      - name: Setup buf
        uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941 # v1.9.0

      - name: Install protoc-gen-go
        working-directory: ffi-hosts/go
        run: |
          version="$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          echo "Installing protoc-gen-go ${version}"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${version}"

      - name: Generate Go bindings via buf
        run: buf generate

      - name: Vet generated bindings
        working-directory: ffi-hosts/go
        run: go vet ./rcproto/...
