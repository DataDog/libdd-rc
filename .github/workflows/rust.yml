# Rust source code quality checks.

name: rust
permissions:
  contents: read

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  # https://github.com/aws/aws-lc-rs/issues/569
  AWS_LC_FIPS_SYS_CC: clang

jobs:
  check:
    strategy:
      matrix:
        include:
          # "test" populates the debug cache: it builds everything a debug build
          # compiles, but also all the dev-dependencies needed for tests.
          - name: dev
            cmd: cargo build --workspace
            cache: debug
            save: false
          - name: release
            cmd: cargo build --workspace --release
            cache: release
          - name: benchmarks
            cmd: cargo test --workspace --benches --no-run
            cache: debug
            save: false
          - name: clippy
            cmd: cargo clippy --workspace -- -D warnings
            cache: clippy
          - name: test # Saves the debug cacle.
            cmd: cargo test --workspace
            cache: debug
          - name: fmt
            cmd: cargo fmt --check
            cache: ""
          # As above, "non-fips test" populates the non-fips cache.
          - name: non-fips build
            cmd: cargo build --workspace --no-default-features --features=non-fips
            cache: non-fips
            save: false
          - name: non-fips test
            cmd: cargo test --workspace --no-default-features --features=non-fips
            cache: non-fips # Saves the non-fips cache

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/datadog/libdd-rc/rust-ci:1.97.1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key-prefix: ${{ matrix.cache }}
          # Empty for most jobs; anything but "false" saves.
          cache-save: ${{ matrix.save }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # Check for banned crates, invalid sources, security advisories, and licenses
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2.0.15
        with:
          arguments: --workspace
          command: check bans sources advisories licenses
