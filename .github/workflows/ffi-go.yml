# Verify that Go protobuf bindings can be generated from the rc-x509-proto
# schema and that the resulting ffi-hosts/go/rcproto package compiles cleanly
# with the rest of the Go host. The generated bindings are not committed
# (see buf.gen.yaml), so this replaces a generate-then-diff check with a
# generate-then-build one.

name: ffi-go
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

env:
  # https://github.com/aws/aws-lc-rs/issues/569
  AWS_LC_FIPS_SYS_CC: clang

jobs:
  go-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/datadog/libdd-rc/rust-ci:1.93.0
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache-key-prefix: release

      - name: Add Go bin to PATH
        run: echo "/root/go/bin" >> "$GITHUB_PATH"

      - name: Run go vet + tests
        working-directory: ffi-hosts/go
        run: make vet test
