# Verify that committed Go protobuf bindings match the rc-x509-proto schema and
# that ffi-hosts/go compiles and tests cleanly with those bindings.

name: ffi-go
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

env:
  # https://github.com/aws/aws-lc-rs/issues/569
  AWS_LC_FIPS_SYS_CC: clang

jobs:
  go-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/datadog/libdd-rc/rust-ci:1.97.1
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          # Shares the release build cache with the rust workflow's release job.
          cache-key-prefix: release
          # That job builds the whole workspace; this one builds only
          # rc-x509-ffi, so would only ever shrink the cache.
          cache-save: false

      - name: Add Go bin to PATH
        run: echo "/root/go/bin" >> "$GITHUB_PATH"

      - name: Install protoc-gen-go
        working-directory: ffi-hosts/go
        run: |
          version="$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${version}"

      - name: Verify committed Go protobuf bindings
        working-directory: ffi-hosts/go
        run: |
          rm -rf rcproto
          make generate
          if [ -n "$(git status --porcelain --untracked-files=all -- rcproto)" ]; then
            git diff -- rcproto
            git status --short --untracked-files=all -- rcproto
            echo "Generated Go protobuf bindings are out of sync; run 'buf generate' and commit ffi-hosts/go/rcproto."
            exit 1
          fi

      - name: Run go vet + tests
        working-directory: ffi-hosts/go
        run: make vet test
