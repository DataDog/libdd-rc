# Common setup for Rust CI jobs running in a Rust container image.
#
# The short version is "cache compilation artefacts on main, reuse in PRs".
# Because the compilation artefacts differ depending on the feature set /
# release mode, a "cache key" is accepted from the caller to differentiate
# between them.
#
# The repository must already be checked out before using this action (the
# action is referenced via a local path, so it must exist on disk).

name: Setup Rust environment
description: Install build dependencies and configure cargo caching.

inputs:
  cache-key-prefix:
    description: >
      Prefix for the cargo cache key (e.g. "dev", "release", "fuzz"). If
      omitted, caching is disabled entirely.
    required: false
    default: ""

  cache-save:
    description: >
      Whether this job may populate the cache for its key, as opposed to only
      reading it. Set to "false" for jobs that share a key with a job building
      a superset of their artefacts: the jobs race to save, and the first to
      finish wins, so the loser's extra artefacts would never be cached.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Disable incremental compilation of dirty crates; clean crates are not
    # rebuilt.
    - name: Disable incremental compilation
      shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    ############################################################################
    # Caches are only saved on the main branch.
    #
    # This reduces cache usage by reusing the vast majority of compilation
    # artefacts from main in most PRs, without creating an entry-per-PR that
    # causes cache churn.
    #

    # The cargo cache holds the crates.io index state, and is reused across all
    # builds (ignores the cache-key-prefix).
    - name: Cargo cache
      id: cargo-cache
      if: inputs.cache-key-prefix != '' && inputs.cache-save != 'false' && github.ref == 'refs/heads/main'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          /usr/local/cargo/registry/index
          /usr/local/cargo/registry/cache
          /usr/local/cargo/git/db
        key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-cargo-cache-

    - name: Cargo cache (restore only)
      if: inputs.cache-key-prefix != '' && (inputs.cache-save == 'false' || github.ref != 'refs/heads/main')
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          /usr/local/cargo/registry/index
          /usr/local/cargo/registry/cache
          /usr/local/cargo/git/db
        key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-cargo-cache-

    # The build cache holds the compilation artefacts and is per-build-flavour,
    # specified by the cache-key-prefix input.
    - name: Build cache
      id: build-cache
      if: inputs.cache-key-prefix != '' && inputs.cache-save != 'false' && github.ref == 'refs/heads/main'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          **/target
          !**/target/**/incremental
        key: ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-

    - name: Build cache (restore only)
      if: inputs.cache-key-prefix != '' && (inputs.cache-save == 'false' || github.ref != 'refs/heads/main')
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          **/target
          !**/target/**/incremental
        key: ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-${{ hashFiles('**/Cargo.lock') }}
          ${{ runner.os }}-target-cache-${{ inputs.cache-key-prefix }}-

    # aws-lc-fips-sys uses CMake which caches absolute paths to source files
    # extracted during the build. The target cache preserves CMake's config
    # but not the extracted sources, causing stale path errors on restore.
    # Cleaning the package forces CMake to re-configure from scratch.
    - name: Clean stale aws-lc build state
      if: inputs.cache-key-prefix != ''
      shell: bash
      run: cargo clean -p aws-lc-fips-sys -p aws-lc-sys 2>/dev/null || true

    # Add the magic env var so that rc-x509-client can correctly set the git
    # hash, which is verified as readable during tests.
    - name: Set git ref for build info
      shell: bash
      run: echo "_OVERRIDE_GIT_VERSION_HASH=${{ github.sha }}" >> $GITHUB_ENV

    # Configure proptests to timeout and fail after 10s.
    #
    # https://docs.rs/proptest/latest/proptest/test_runner/struct.Config.html#structfield.timeout
    - name: Configure proptest timeout config
      shell: bash
      run: echo "PROPTEST_TIMEOUT=10000" >> $GITHUB_ENV
