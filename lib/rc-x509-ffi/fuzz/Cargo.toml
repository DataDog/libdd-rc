[package]
name = "rc-x509-ffi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
futures = "0.3.32"
libfuzzer-sys = "0.4"
rc-x509-client.workspace = true
rc-x509-ffi.workspace = true
rc-x509-proto.workspace = true
tokio = { version = "1.52.3", features = ["macros", "parking_lot", "rt", "sync", "time"] }
tokio-util = "0.7.18"

[build-dependencies]
twox-hash = "2.1.2"
rc-x509-proto.workspace = true

[[bin]]
name = "ffi_io"
path = "fuzz_targets/ffi_io.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dispatch"
path = "fuzz_targets/dispatch.rs"
test = false
doc = false
bench = false
