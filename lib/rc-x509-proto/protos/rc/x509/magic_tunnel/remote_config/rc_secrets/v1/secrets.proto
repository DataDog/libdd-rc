syntax = "proto3";
package rc.x509.magic_tunnel.remote_config.rc_secrets.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/DataDog/libdd-rc/ffi-hosts/go/rcproto/magic_tunnel/remote_config/rc_secrets;rcsecretsv1";

// A service used by the Remote Config secrets delivery flow to prepare a
// connected client to receive a secret.
//
// The fully-qualified URI to register a handler for the "PrepareSecretDelivery"
// method is:
//
//  rc.x509.magic_tunnel.remote_config.rc_secrets.v1.SecretsService/PrepareSecretDelivery
//
service SecretsService {
  // Ask the client to prove its identity and to generate a single-use public
  // key that the secret will be encrypted to.
  //
  // This call has side effects on the client: it generates a key pair and holds
  // the private key in memory, keyed by `encryption_context_id`, until the
  // secret is delivered or `key_validity` has elapsed.
  rpc PrepareSecretDelivery(PrepareSecretDeliveryRequest) returns (PrepareSecretDeliveryResponse);
}

// A request for a client to prepare to receive a secret.
message PrepareSecretDeliveryRequest {
  // The Connection ID of the client to prepare.
  string connection_id = 1;

  // An ID chosen by the backend that ties this call to the later delivery of
  // the secret.
  string encryption_context_id = 2;

  // The product the secret is destined for (for example "ndm"), used to select
  // the client's registered handler for that product.
  string product = 3;
}

// The result of preparing a client to receive a secret.
message PrepareSecretDeliveryResponse {
  // The outcome of the call.
  //
  // All other fields are only set when this is
  // `PREPARE_SECRET_DELIVERY_STATUS_OK`.
  PrepareSecretDeliveryStatus status = 1;

  // A proof of the client's identity, used by the backend to resolve the
  // organization the client belongs to.
  //
  // This is a placeholder: today it is expected to be a WIF JWT, but its shape
  // may change as WIF defines what is needed for a full token.
  //
  // This is a bearer credential: it MUST NOT be logged.
  //
  // TODO: annotate with `[debug_redact = true]` once it is supported by our
  // protoc, prost and protobuf-go versions. It is rejected today, so `Debug`
  // is redacted by hand in `rc-x509-proto`.
  string token = 2;

  // The single-use public key the secret must be encrypted to.
  bytes public_key = 3;

  // The type of `public_key`, which also selects how the secret is encrypted.
  KeyType key_type = 4;

  // How long the client keeps the private key, measured from when the client
  // generated it.
  //
  // This is a duration rather than a deadline so the backend can compute the
  // expiry from its own clock, unaffected by clock drift on the client.
  google.protobuf.Duration key_validity = 5;
}

// The outcome of a `PrepareSecretDelivery` call.
//
// More statuses will be added as further outcomes are identified, so
// consumers must handle values they do not recognise.
enum PrepareSecretDeliveryStatus {
  PREPARE_SECRET_DELIVERY_STATUS_UNSPECIFIED = 0;

  // The client is prepared, and the response carries an identity token and a
  // public key.
  PREPARE_SECRET_DELIVERY_STATUS_OK = 1;

  // The client has no handler registered for the requested product.
  PREPARE_SECRET_DELIVERY_STATUS_PRODUCT_UNKNOWN = 2;

  // The client could not obtain an identity token, for example because it is
  // not onboarded to WIF.
  PREPARE_SECRET_DELIVERY_STATUS_IDENTITY_UNAVAILABLE = 3;
}

// The type of a public key returned by `PrepareSecretDelivery`.
enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;

  // A raw 32-byte X25519 (Curve25519) public key. The secret is encrypted to it
  // as a NaCl anonymous sealed box (`box.SealAnonymous` in
  // golang.org/x/crypto/nacl/box).
  KEY_TYPE_NACL_SEALED_BOX_X25519 = 1;

  // An ML-KEM-768 encapsulation key. The secret is encrypted with AES-256-GCM
  // under a key derived from the ML-KEM-768 shared secret (FIPS-approved
  // algorithms).
  KEY_TYPE_MLKEM768_AES256_GCM = 2;
}
