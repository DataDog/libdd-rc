syntax = "proto3";
package rc.x509.magic_tunnel.rc_secrets.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/DataDog/libdd-rc/ffi-hosts/go/rcproto/magic_tunnel/rc_secrets;rcsecretsv1";

// A service used by the Remote Config secrets delivery flow to prepare a
// connected client to receive a secret.
//
// The fully-qualified URI to register a handler for the "PrepareSecretDelivery"
// method is:
//
//  rc.x509.magic_tunnel.rc_secrets.v1.SecretsService/PrepareSecretDelivery
//
service SecretsService {
  // Ask the client to prove its identity and to generate a single-use public
  // key that the secret will be encrypted to.
  //
  // This call has side effects on the client: it generates a key pair and holds
  // the private key in memory, keyed by `encryption_context_id`, until the
  // secret is delivered or `key_expires_at` passes.
  //
  // A failure is reported by the handler returning an error, not as a field in
  // the response. Error messages MUST NOT contain secret or credential values.
  rpc PrepareSecretDelivery(PrepareSecretDeliveryRequest) returns (PrepareSecretDeliveryResponse);
}

// A request for a client to prepare to receive a secret.
message PrepareSecretDeliveryRequest {
  // The Connection ID of the client to prepare.
  string connection_id = 1;

  // An ID chosen by the backend that ties this call to the later delivery of
  // the secret.
  string encryption_context_id = 2;

  // The product the secret is destined for (for example "ndm"), used to select
  // the client's registered handler for that product.
  string product = 3;
}

// The result of preparing a client to receive a secret.
message PrepareSecretDeliveryResponse {
  // A proof of the client's identity, used by the backend to resolve the
  // organization the client belongs to.
  //
  // This is a placeholder: today it is expected to be a WIF JWT, but its shape
  // may change as WIF defines what is needed for a full token.
  //
  // This is a bearer credential: it MUST NOT be logged.
  string token = 1 [debug_redact = true];

  // The single-use public key the secret must be encrypted to.
  bytes public_key = 2;

  // The type of `public_key`, which also selects how the secret is encrypted.
  KeyType key_type = 3;

  // The time after which the client discards the private key, and the secret
  // can no longer be delivered for this `encryption_context_id`.
  google.protobuf.Timestamp key_expires_at = 4;
}

// The type of a public key returned by `PrepareSecretDelivery`.
enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;

  // A raw 32-byte X25519 (Curve25519) public key. The secret is encrypted to it
  // as a NaCl anonymous sealed box (`box.SealAnonymous` in
  // golang.org/x/crypto/nacl/box).
  KEY_TYPE_NACL_SEALED_BOX_X25519 = 1;
}
