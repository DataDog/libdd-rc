syntax = "proto3";
package rc.x509.magic_tunnel.remote_queries.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/DataDog/libdd-rc/ffi-hosts/go/rcproto/magic_tunnel/remote_queries;remotequeriesv1";

// A smoke service for the Remote Queries team to prove that a team-owned
// handler can decode and handle requests dispatched over the Magic Tunnel.
//
// The fully-qualified URI to register a handler for the "Ping" method is:
//
//  rc.x509.magic_tunnel.remote_queries.v1.RemoteQueryService/Ping
//
service RemoteQueryService {
  // Ping the specified client by connection ID.
  rpc Ping(PingRequest) returns (PingResponse);
}

// A request to "ping" a specific client.
message PingRequest {
  // The Connection ID of the client to ping.
  string connection_id = 1;

  // A reason for the ping, echoed back in the response.
  string reason = 2;
}

// Return a "pong" to a "ping".
message PingResponse {
  // The current timestamp as reported by the client.
  google.protobuf.Timestamp now = 1;

  // The reason from the request, echoed back by the handler.
  string reason = 2;
}
