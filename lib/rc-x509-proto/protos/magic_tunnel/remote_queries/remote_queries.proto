syntax = "proto3";
package rc.x509.magic_tunnel.remote_queries.v1alpha1;

option go_package = "github.com/DataDog/libdd-rc/ffi-hosts/go/rcproto/magic_tunnel/remote_queries;remotequeriesv1alpha1";

// A service for the Remote Queries team to start query runs on
// connected clients. The fully-qualified URIs to register handlers for are:
//
//  rc.x509.magic_tunnel.remote_queries.v1alpha1.RemoteQueriesService/ResolveTarget
//  rc.x509.magic_tunnel.remote_queries.v1alpha1.RemoteQueriesService/StartRun
service RemoteQueriesService {
  rpc ResolveTarget(ResolveTargetRequest) returns (ResolveTargetResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
}

message ResolveTargetRequest {
  string connection_id = 1;
  string reason = 2;
  string integration = 3;
  Target target = 4;
}

message ResolveTargetResponse {
  ResolveTargetStatus status = 1;
  string error_message = 2;
}

enum ResolveTargetStatus {
  RESOLVE_TARGET_STATUS_UNSPECIFIED = 0;
  RESOLVE_TARGET_STATUS_MATCHED = 1;
  RESOLVE_TARGET_STATUS_TARGET_NOT_FOUND = 2;
  RESOLVE_TARGET_STATUS_AMBIGUOUS_TARGET = 3;
  RESOLVE_TARGET_STATUS_RESOLUTION_ERROR = 4;
}

message StartRunRequest {
  string connection_id = 1;
  string reason = 2;
  string integration = 3;
  Target target = 4;
  string query = 5;
  bool include_schema = 6;
  // Where the client uploads the query results.
  ResultDelivery result_delivery = 7;
}

// The database to run the query against. Carries no credentials.
message Target {
  string host = 1;
  int32 port = 2;
  string dbname = 3;
  string database_instance = 4;
}

message ResultDelivery {
  // Identifies the run. StartRun requests with the same run_id are
  // deduplicated.
  string run_id = 1;
  string task_id = 2;
  int32 artifact_version = 3;
  string upload_id = 4;
  string base_url = 5;
  UploadLimits limits = 6;
}

message UploadLimits {
  int64 max_file_bytes = 1;
  int64 max_result_bytes = 2;
  int64 max_row_bytes = 3;
  int64 max_columns = 4;
  int64 max_schema_bytes = 5;
  int64 max_pages = 6;
  int64 timeout_ms = 7;
}

message StartRunResponse {
  StartRunStatus status = 1;
  // A machine-readable error code, set when the run is rejected.
  string error_code = 2;
  string error_message = 3;
}

enum StartRunStatus {
  START_RUN_STATUS_UNSPECIFIED = 0;
  START_RUN_STATUS_ACCEPTED = 1;
  // A run with this run_id was already accepted.
  START_RUN_STATUS_ALREADY_ACCEPTED = 2;
  START_RUN_STATUS_REJECTED = 3;
}
