[package]
name = "rc-x509-client-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
futures = "0.3.32"
libfuzzer-sys = "0.4"
rc-x509-client = { version = "0.2.0", path = "..", features = ["fuzzing"] }
tokio = { version = "1.52.3", features = ["macros", "parking_lot", "rt", "sync", "time"] }
tokio-stream = "0.1.18"

[[bin]]
name = "message_delivery"
path = "fuzz_targets/message_delivery.rs"
test = false
doc = false
bench = false
