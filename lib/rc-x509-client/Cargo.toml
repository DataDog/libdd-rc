[package]
name = "rc-x509-client"
version = "0.2.2"
edition.workspace = true
license = "Apache-2.0"
description = "Rust client for the RC X509 platform"
repository = "https://github.com/DataDog/libdd-rc"

[lints]
workspace = true

[dependencies]
arbitrary = { version = "1", optional = true, features = ["derive"] }
futures = "0.3.32"
rc-x509-proto.workspace = true
rc-x509-trust.workspace = true
rc-x509-roots.workspace = true
rc-crypto.workspace = true
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"
tracing = "0.1.44"
pin-project = "1.1.13"

# parking_lot's thread parker is unimplemented on wasm targets (it panics at
# runtime), so enable it everywhere else only.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.52.3", features = ["parking_lot"] }

[dev-dependencies]
assert_matches = "1.5.0"
proptest = "1.11.0"
proptest-derive = "0.9.0"
tokio = { version = "1.52.3", features = ["test-util"] }

[features]
fuzzing = ["dep:arbitrary", "rc-x509-trust/fuzzing", "rc-crypto/fuzzing"]
default = ["fips"]
fips = ["rc-x509-trust/fips", "rc-crypto/fips"]
non-fips = ["rc-x509-trust/non-fips", "rc-crypto/non-fips"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tracing_unstable"]
rustdoc-args = ["--cfg", "tracing_unstable"]
