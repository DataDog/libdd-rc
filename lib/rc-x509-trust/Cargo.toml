[package]
name = "rc-x509-trust"
version = "0.3.0"
edition.workspace = true
license = "Apache-2.0"
description = "Trust and attestation library for the RC X509 platform"
repository = "https://github.com/DataDog/libdd-rc"

[dependencies]
arbitrary = { version = "1", optional = true, features = ["derive"] }
bytes = "1.11.1"
mini-moka = "0.10.3"
proptest = { version = "1.11.0", optional = true }
proptest-derive = { version = "0.9.0", optional = true }
rc-crypto.workspace = true
rc-x509-roots.workspace = true
rustls-pki-types = { version = "1.14.0", features = ["std"] }
rustls-webpki = "0.103.16"
thiserror = "2.0.18"
tracing = { version = "0.1.44", features = ["valuable"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64"] }
valuable = "0.1.1"
xorf = { version = "0.13.0", default-features = false, features = ["binary-fuse"] }

[dev-dependencies]
assert_matches = "1.5.0"
proptest = "1.11.0"
rc-x509-test-helpers = { workspace = true, features = ["test-issuer"] }
rcgen = { version = "0.14", default-features = false }

[lints]
workspace = true

[features]
default = ["fips"]
arbitrary = ["dep:proptest", "dep:proptest-derive"]
fuzzing = ["dep:arbitrary"]
fips = [
	"rustls-webpki/aws-lc-rs-fips",
	"rc-crypto/fips",
	"rc-x509-roots/fips",
	"rc-x509-test-helpers/fips",
]
non-fips = [
	"rustls-webpki/aws-lc-rs",
	"rc-crypto/non-fips",
	"rc-x509-roots/non-fips",
	"rc-x509-test-helpers/non-fips",
]
