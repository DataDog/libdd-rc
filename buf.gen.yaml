# Generates Go bindings for the rc-x509-proto message types, consumed by the
# ffi-hosts/go/ddrc package for protobuf-typed dispatch.
#
# Run from the repository root with:
#
#   buf generate
#
# Generated output is committed under ffi-hosts/go/rcproto so the published Go
# module contains every package imported by ffi-hosts/go. Regenerate and commit
# the bindings whenever the rc-x509-proto schema changes.
#
# protoc-gen-go is not taken from $PATH: it is built with `go run` so the
# output is reproducible across machines.
#
#   * The Go toolchain is pinned with GOTOOLCHAIN, because protoc-gen-go formats
#     its output with the standard library's go/format, and formatting changes
#     between Go releases (e.g. Go 1.27 reformats doc comments).
version: v2
plugins:
  - local:
      - env
      - GOTOOLCHAIN=go1.26.0
      - go
      - run
      - -C
      - ffi-hosts/go
      - google.golang.org/protobuf/cmd/protoc-gen-go
    out: ffi-hosts/go
    opt: module=github.com/DataDog/libdd-rc/ffi-hosts/go
