# Generates Go bindings for the rc-x509-proto message types, consumed by the
# ffi-hosts/go/ddrc package for protobuf-typed dispatch.
#
# Run locally with:
#
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   buf generate
#
# Generated output (ffi-hosts/go/rcproto) is not committed: it's regenerated
# on demand, either directly via the commands above or as a prerequisite of
# `make build`/`make test`/`make vet` in ffi-hosts/go.
version: v2
plugins:
  - local: protoc-gen-go
    out: ffi-hosts/go
    opt: module=github.com/DataDog/libdd-rc/ffi-hosts/go
